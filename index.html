<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fera Aesthetics</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: #f3d7d3;
      background-image: radial-gradient(circle at 50% 10%, #fffcfc 0%, #f8e4e2 45%, #eccbc6 82%, #dfb7b1 100%);
      color: #3b1d22;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }
    .hero {
      text-align: center;
      border: 1px solid rgba(197, 140, 126, 0.7);
      border-radius: 20px;
      padding: 26px 18px;
      background: rgba(255, 252, 251, 0.72);
    }
    h1 { letter-spacing: 5px; font-size: 32px; margin: 0 0 4px 0; font-weight: normal; }
    .subtitle { color: #a66c5e; letter-spacing: 3.5px; font-size: 13px; margin: 0 0 12px 0; text-transform: uppercase; }
    .tagline { color: #7d4e46; font-size: 11px; letter-spacing: 2px; border-top: 1px solid rgba(217, 171, 160, 0.75); padding-top: 10px; margin: 0; }
    .catchphrase { color: #5c2a31; font-size: 13.5px; font-style: italic; margin: 8px 0 0 0; }
    .location { font-size: 12.5px; color: #6e4742; margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>FERA</h1>
    <p class="subtitle">Aesthetics</p>
    <p class="tagline">LASHES &bull; BROWS &bull; CURATED</p>
    <p class="catchphrase">Softness with an edge.</p>
    <p class="location">Mobile &amp; Booking-Only Beauty Services &bull; Ruiru, Kihunguro</p>
  </header>
