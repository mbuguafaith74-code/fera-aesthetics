<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fera Aesthetics | Lashes, Brows & Booking Estimator</title>
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: #f3d7d3;
      background-image:
        radial-gradient(circle at 50% 10%, #fffcfc 0%, #f8e4e2 45%, #eccbc6 82%, #dfb7b1 100%);
      background-attachment: fixed;
      color: #3b1d22;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px 64px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient layer: faint watermark, falling petals, and glass floor */
    .ambient-stage {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .watermark-layer {
      position: absolute;
      inset: -15%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      transform: rotate(-14deg);
      opacity: 0.055;
      user-select: none;
    }

    .watermark-line {
      font-size: 34px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #5a2830;
      white-space: nowrap;
    }

    .petal {
      position: absolute;
      top: -40px;
      will-change: transform, opacity;
      animation: petalFall linear infinite;
    }

    @keyframes petalFall {
      0% {
        transform: translate3d(0, -40px, 0) rotate(0deg) scale(1);
        opacity: 0;
      }
      12% {
        opacity: 0.75;
      }
      78% {
        opacity: 0.65;
      }
      100% {
        transform: translate3d(var(--drift, 24px), 92vh, 0) rotate(var(--spin, 210deg)) scale(0.92);
        opacity: 0;
      }
    }

    /* Glass-like floor plane at the bottom */
    .glass-floor {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 115px;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(255, 252, 251, 0.08) 0%,
        rgba(255, 250, 249, 0.42) 48%,
        rgba(235, 198, 193, 0.65) 100%
      );
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 253, 252, 0.75);
      box-shadow:
        inset 0 1px 0 rgba(197, 140, 126, 0.35),
        0 -8px 24px rgba(92, 46, 50, 0.05);
    }

    .glass-floor::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.35) 45%,
        transparent 68%
      );
    }

    nav.top-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    nav.top-nav a {
      text-decoration: none;
      color: #3b1d22;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255, 252, 251, 0.68);
      border: 1px solid rgba(197, 140, 126, 0.65);
      backdrop-filter: blur(8px);
    }

    header.hero {
      text-align: center;
      border: 1px solid rgba(197, 140, 126, 0.7);
      outline: 1px solid rgba(197, 140, 126, 0.3);
      outline-offset: -6px;
      border-radius: 20px;
      padding: 28px 20px;
      background: rgba(255, 252, 251, 0.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 28px rgba(92, 46, 50, 0.08);
      margin-bottom: 24px;
    }

    h1 {
      color: #3b1d22;
      letter-spacing: 5px;
      font-size: 32px;
      margin: 0 0 4px 0;
      font-weight: normal;
    }

    .subtitle {
      color: #a66c5e;
      letter-spacing: 3.5px;
      font-size: 13px;
      margin: 0 0 12px 0;
      text-transform: uppercase;
    }

    .tagline {
      color: #7d4e46;
      font-size: 11px;
      letter-spacing: 2px;
      border-top: 1px solid rgba(217, 171, 160, 0.75);
      padding-top: 10px;
      margin: 0;
    }

    .catchphrase {
      color: #5c2a31;
      font-size: 13.5px;
      font-style: italic;
      letter-spacing: 0.8px;
      margin: 8px 0 0 0;
    }

    .location {
      font-size: 12.5px;
      color: #6e4742;
      margin-top: 10px;
      font-style: italic;
    }

    .hero-cta {
      display: inline-block;

      color: #fffcfc;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border-radius: 10px;
    }

    section.web-section {

    h2 {
      color: #3b1d22;

    .hint {
      font-size: 13px;

      margin-top: 0;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .category-title {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9c6154;
      margin: 20px 0 8px 0;
    }

    label.service-card, .charm-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 252, 251, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(214, 164, 152, 0.65);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 10px;
      box-shadow: 0 6px 16px rgba(92, 46, 50, 0.06);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    label.service-card:has(input:checked) {
      background: rgba(255, 252, 251, 0.9);
      border-color: #b57b6d;
    }

    .service-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="checkbox"] {
      accent-color: #a66c5e;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .service-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .service-name {
      font-size: 15px;
      color: #3b1d22;
    }

    .service-meta {
      font-size: 13px;
      color: #9c6154;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
