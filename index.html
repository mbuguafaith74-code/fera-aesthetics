<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fera Aesthetics</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: #f3d7d3;
      background-image: radial-gradient(circle at 50% 10%, #fffcfc 0%, #f8e4e2 45%, #eccbc6 82%, #dfb7b1 100%);
      color: #3b1d22;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }
    .hero {
      text-align: center;
      border: 1px solid rgba(197, 140, 126, 0.7);
      border-radius: 20px;
      padding: 26px 18px;
      background: rgba(255, 252, 251, 0.72);
    }
    h1 { letter-spacing: 5px; font-size: 32px; margin: 0 0 4px 0; font-weight: normal; }
    .subtitle { color: #a66c5e; letter-spacing: 3.5px; font-size: 13px; margin: 0 0 12px 0; text-transform: uppercase; }
    .tagline { color: #7d4e46; font-size: 11px; letter-spacing: 2px; border-top: 1px solid rgba(217, 171, 160, 0.75); padding-top: 10px; margin: 0; }
    .catchphrase { color: #5c2a31; font-size: 13.5px; font-style: italic; margin: 8px 0 0 0; }
    .location { font-size: 12.5px; color: #6e4742; margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>FERA</h1>
    <p class="subtitle">Aesthetics</p>
    <p class="tagline">LASHES &bull; BROWS &bull; CURATED</p>
    <p class="catchphrase">Softness with an edge.</p>
    <p class="location">Mobile &amp; Booking-Only Beauty Services &bull; Ruiru, Kihunguro</p>
  </header>
  <style>
    .category-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #9c6154; margin: 22px 0 8px 0; }
    label.service-card {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255, 252, 251, 0.65); border: 1px solid rgba(214, 164, 152, 0.65);
      border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
    }
    input[type="checkbox"] { accent-color: #a66c5e; width: 18px; height: 18px; }
    .service-info { display: flex; flex-direction: column; gap: 3px; }
    .service-name { font-size: 15px; color: #3b1d22; }
    .service-meta { font-size: 13px; color: #9c6154; }
  </style>

  <section id="services">
    <p class="category-title">Cluster Lashes</p>
    <label class="service-card">
      <input type="checkbox" data-name="Cluster Lashes" data-price="350" data-mins="30">
      <div class="service-info">
        <span class="service-name">Cluster Lashes</span>
        <span class="service-meta">KES 350 &bull; 30 mins</span>
      </div>
    </label>

    <p class="category-title">Individual Lashes</p>
    <label class="service-card">
      <input type="checkbox" data-name="Classic Cat Eye Lashes" data-price="500" data-mins="60">
      <div class="service-info">
        <span class="service-name">Classic Cat Eye Lashes</span>
        <span class="service-meta">KES 500 &bull; 60 mins</span>
      </div>
    </label>

    <label class="service-card">
      <input type="checkbox" data-name="Hybrid Cat Eye Lashes" data-price="700" data-mins="75">
      <div class="service-info">
        <span class="service-name">Hybrid Cat Eye Lashes</span>
        <span class="service-meta">KES 700 &bull; 75 mins</span>
      </div>
    </label>

    <label class="service-card">
      <input type="checkbox" data-name="Classic Wispy Lashes" data-price="600" data-mins="65">
      <div class="service-info">
        <span class="service-name">Classic Wispy Lashes</span>
        <span class="service-meta">KES 600 &bull; 65 mins</span>
      </div>
    </label>

    <label class="service-card">
      <input type="checkbox" data-name="Hybrid Wispy Lashes" data-price="800" data-mins="80">
      <div class="service-info">
        <span class="service-name">Hybrid Wispy Lashes</span>
        <span class="service-meta">KES 800 &bull; 80 mins</span>
      </div>
    </label>
