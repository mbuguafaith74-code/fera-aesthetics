<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fera Aesthetics | Service & Booking Estimator</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #fdf6f5 0%, #f5e2e0 100%);
      color: #3b1d22;
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      border: 1.5px solid #c58c7e;
      border-radius: 14px;
      padding: 22px 16px;
      background-color: rgba(255, 255, 255, 0.72);
      margin-bottom: 24px;
    }

    h1 {
      color: #3b1d22;
      letter-spacing: 4px;
      font-size: 28px;
      margin: 0 0 4px 0;
      font-weight: normal;
    }

    .subtitle {
      color: #a66c5e;
      letter-spacing: 3px;
      font-size: 13px;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }

    .tagline {
      color: #7d4e46;
      font-size: 11px;
      letter-spacing: 2px;
      border-top: 1px solid #d9aba0;
      padding-top: 8px;
      margin: 0;
    }

    .location {
      font-size: 12px;
      color: #6e4742;
      margin-top: 8px;
      font-style: italic;
    }

    h2 {
      color: #3b1d22;
      font-size: 17px;
      font-weight: normal;
      margin-bottom: 4px;
    }

    .hint {
      font-size: 13px;
      color: #7d4e46;
      margin-top: 0;
      margin-bottom: 14px;
    }

    label.service-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid #d6a498;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: #a66c5e;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .service-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .service-name {
      font-size: 15px;
      color: #3b1d22;
    }

    .service-meta {
      font-size: 13px;
      color: #9c6154;
    }

    .summary-box {
      margin-top: 22px;
      background-color: #fffaf9;
      border: 1.5px solid #c58c7e;
      border-radius: 12px;
      padding: 16px;
    }

    .summary-box p {
      margin: 6px 0;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      background-color: transparent;
      border: 1px solid #b57b6d;
      color: #3b1d22;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>FERA</h1>
    <p class="subtitle">Aesthetics</p>
    <p class="tagline">LASHES &bull; BROWS &bull; CURATED</p>
    <p class="location">Mobile &amp; Booking-Only Beauty Services &bull; Ruiru, Kihunguro</p>
  </header>

  <h2>Select Your Services</h2>
  <p class="hint">Choose your treatments below to estimate your total and appointment time.</p>

  <!-- EDIT PRICES & TIMES DIRECTLY IN data-price AND data-mins BELOW -->
  <label class="service-card">
    <input type="checkbox" data-price="1200" data-mins="90">
    <div class="service-info">
      <span class="service-name">Individual Lashes — Classic (Cat Eye / Wispy)</span>
      <span class="service-meta">KES 1,200 &bull; 90 mins</span>
    </div>
  </label>

  <label class="service-card">
    <input type="checkbox" data-price="1500" data-mins="110">
    <div class="service-info">
      <span class="service-name">Individual Lashes — Hybrid (Cat Eye / Wispy)</span>
      <span class="service-meta">KES 1,500 &bull; 110 mins</span>
    </div>
  </label>

  <label class="service-card">
    <input type="checkbox" data-price="800" data-mins="45">
    <div class="service-info">
      <span class="service-name">Cluster Lashes</span>
      <span class="service-meta">KES 800 &bull; 45 mins</span>
    </div>
  </label>

  <label class="service-card">
    <input type="checkbox" data-price="600" data-mins="40">
    <div class="service-info">
      <span class="service-name">Brow Shaping &amp; Tinting</span>
      <span class="service-meta">KES 600 &bull; 40 mins</span>
    </div>
  </label>

  <div class="summary-box">
    <p id="total-price"><strong>Estimated Total:</strong> KES 0</p>
    <p id="total-time"><strong>Estimated Time:</strong> 0 mins</p>
    <button type="button" id="reset-btn">Clear Selection</button>
  </div>

  <script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const totalPriceEl = document.getElementById("total-price");
    const totalTimeEl = document.getElementById("total-time");
    const resetBtn = document.getElementById("reset-btn");

    function updateEstimate() {
      let totalPrice = 0;
      let totalMins = 0;

      checkboxes.forEach((box) => {
        if (box.checked) {
          totalPrice += Number(box.dataset.price);
          totalMins += Number(box.dataset.mins);
        }
      });

      totalPriceEl.innerHTML = `<strong>Estimated Total:</strong> KES ${totalPrice.toLocaleString()}`;
      totalTimeEl.innerHTML = `<strong>Estimated Time:</strong> ${totalMins} mins`;
    }

    checkboxes.forEach((box) => box.addEventListener("change", updateEstimate));

    resetBtn.addEventListener("click", () => {
      checkboxes.forEach((box) => (box.checked = false));
      updateEstimate();
    });
  </script>

</body>
</html>
